name: Test, package and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested main commit (also used for initial acceptance)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-package.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.AUTO_DEPLOY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-production
          path: artifact
      - name: Skip superseded main commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          if [ "$latest" = '${{ github.sha }}' ]; then echo 'current=true' >> "$GITHUB_OUTPUT"; else echo 'Superseded by a newer main commit' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload, switch and verify production
        if: steps.head.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy_remote.py --artifact artifact --commit '${{ github.sha }}' --request-id '${{ github.run_id }}-${{ github.run_attempt }}'
