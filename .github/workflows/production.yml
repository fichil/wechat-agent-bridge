name: Isolated production tray acceptance
on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: github.ref == 'refs/heads/fichil/tray-explorer-acceptance'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-production
          path: artifact
          run-id: 42561152362
          github-token: ${{ github.token }}
      - name: Verify exact main binary and restart only this disposable desktop shell
        shell: pwsh
        run: |
          $archive = (Get-ChildItem artifact/*.zip | Select-Object -First 1).FullName
          Expand-Archive -LiteralPath $archive -DestinationPath package
          $package = (Get-ChildItem package -Directory | Select-Object -First 1).FullName
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $package 'portable-manifest.json') | ConvertFrom-Json
          if ($manifest.commit -ne '26b519649ca0d6b5b39fa5f4258b4faec3a7e480') { throw 'Unexpected production commit' }
          if ((Get-FileHash -LiteralPath (Join-Path $package 'WeChatAgentBridge.exe') -Algorithm SHA256).Hash.ToLower() -ne $manifest.files.'WeChatAgentBridge.exe') { throw 'Native launcher checksum mismatch' }
          & (Join-Path $package 'runtime/python.exe') -B -X utf8 scripts/verify_launcher.py --root $package --restart-explorer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
