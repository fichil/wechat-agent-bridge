name: Prepare GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 正式版本号（例如 0.4.0）
        required: true
        type: string
      notes:
        description: 中文更新说明
        required: true
        type: string
      publish:
        description: 附件验证后直接发布正式版（默认生成草稿）
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate stable version and branch
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
  verify:
    needs: validate
    uses: ./.github/workflows/verify-package.yml
    with:
      version: ${{ inputs.version }}
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-production
          path: package
      - name: Prepare and verify complete draft
        working-directory: package
        run: |
          set -euo pipefail
          name="WeChatAgentBridge-${VERSION}-windows-x64"
          tag="v${VERSION}"
          sha256sum --strict -c "$name.zip.sha256"
          jq -e --arg commit "$GITHUB_SHA" --arg version "$VERSION" '.commit == $commit and .version == $version and .development == false and .architecture == "windows-x64"' "$name.manifest.json"
          # Refuse an existing tag/release rather than silently retargeting it.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then echo '版本号已存在'; exit 1; fi
          printf '%s\n\n%s\n\n%s\n' "$NOTES" '首次安装：下载 Windows x64 ZIP 并完整解压，在可写目录打开 WeChatAgentBridge.exe。' '旧版首次迁入：正常停止旧后台，备份并将完整 data 复制到新解压目录，再启动新版本。已安装带更新功能的版本可在网页或启动器中确认升级。' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "微信 Agent Bridge $tag" --notes-file "$RUNNER_TEMP/release-notes.md" "$name.zip" "$name.zip.sha256" "$name.manifest.json"
          gh release download "$tag" --dir "$RUNNER_TEMP/validate"
          for ext in zip zip.sha256 manifest.json; do cmp "$name.$ext" "$RUNNER_TEMP/validate/$name.$ext"; done
          if [[ "$PUBLISH" == true ]]; then gh release edit "$tag" --draft=false --latest; fi
      - name: Verify published anonymous download
        if: inputs.publish
        env:
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          name="WeChatAgentBridge-${VERSION}-windows-x64"
          latest="https://api.github.com/repos/$GH_REPO/releases/latest"
          curl --fail --retry 5 --retry-all-errors -sSL "$latest" | jq -e --arg tag "v$VERSION" '.tag_name == $tag and .draft == false and .prerelease == false'
          mkdir anonymous && cd anonymous
          for ext in zip zip.sha256 manifest.json; do curl --fail --retry 5 --retry-all-errors -sSLO "https://github.com/$GH_REPO/releases/download/v$VERSION/$name.$ext"; done
          sha256sum --strict -c "$name.zip.sha256"
          cmp "$name.manifest.json" "../package/$name.manifest.json"
